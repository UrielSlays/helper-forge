name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test suite
        run: python -m unittest discover -s tests -t .

      # -I keeps the working directory and PYTHONPATH off the import path,
      # which is how a sandboxed reader runs code it has not reviewed yet.
      - name: Test suite, isolated mode
        run: python -I -m unittest discover -s tests -t .

      - name: Offline install, then the example end to end
        shell: bash
        run: |
          python -m pip install --no-index --no-deps .
          hephaestus --version
          hephaestus forge --scenario examples/airgap-port-noise/scenario.json --output "$RUNNER_TEMP/manifest.json"
          hephaestus run --scenario examples/airgap-port-noise/scenario.json --manifest "$RUNNER_TEMP/manifest.json" --events examples/airgap-port-noise/events.jsonl --output "$RUNNER_TEMP/results.jsonl"
          cat "$RUNNER_TEMP/results.jsonl"
